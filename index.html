<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Master Calculator</title>
    <style>
        :root {
            --primary: #58a6ff;
            --bg: #0d1117;
            --surface: #161b22;
            --text: #e6edf3;
            --border: #30363d;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 { 
            font-size: 20px; 
            margin-top: 0; 
            margin-bottom: 20px; 
            text-align: center; 
            color: var(--primary); 
        }

        .group { margin-bottom: 15px; }
        
        label { 
            display: block; 
            font-size: 12px; 
            color: #8b949e; 
            margin-bottom: 6px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }

        .radio-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
        }

        .radio-opt { 
            background: #010409; 
            padding: 10px 6px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            text-align: center; 
            cursor: pointer; 
            font-size: 13px;
            user-select: none;
            transition: all 0.2s;
        }

        input[type="radio"] { display: none; }
        
        input[type="radio"]:checked + .radio-opt { 
            border-color: var(--primary); 
            background: #1f2937; 
            color: var(--primary); 
            font-weight: 600;
        }

        .row-inputs { 
            display: flex; 
            gap: 10px; 
        }

        .row-inputs .group { 
            flex: 1; 
        }

        input[type="number"] { 
            width: 100%; 
            padding: 10px 12px; 
            background: #010409; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            color: white; 
            box-sizing: border-box; 
            font-size: 16px; /* 16px запобігає зуму на iOS */
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .result-panel { 
            background: linear-gradient(145deg, #1c2128, #161b22);
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            margin-top: 20px;
        }

        .res-row { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 8px; 
            font-size: 14px; 
        }

        .res-row:last-child { margin-bottom: 0; }
        
        .res-val { 
            color: var(--primary); 
            font-weight: bold; 
        }

        .viz-box { 
            margin-top: 20px; 
            padding: 15px; 
            background: #010409; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow-x: auto; 
            gap: 6px; 
            min-height: 80px; 
            justify-content: center;
        }

        .battery-row { 
            display: flex; 
            gap: 6px; 
            align-items: center; 
        }

        .cell { 
            width: 22px; 
            height: 36px; 
            background: #21262d; 
            border: 2px solid var(--primary); 
            border-radius: 4px; 
            flex-shrink: 0;
        }

        footer { 
            margin-top: 20px; 
            font-size: 12px; 
            text-align: center; 
            color: #8b949e; 
        }

        footer a { 
            color: var(--primary); 
            text-decoration: none; 
        }

        footer a:hover { text-decoration: underline; }

        /* Медіа-запит для дуже маленьких екранів (старі смартфони) */
        @media (max-width: 380px) {
            .card { padding: 12px; }
            h1 { font-size: 18px; }
            .radio-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Battery Master Calculator</h1>

    <div class="group">
        <label>Тип акумулятора:</label>
        <div class="radio-grid">
            <label><input type="radio" name="chem" value="liion" checked onchange="calc()"> <div class="radio-opt">Li-ion</div></label>
            <label><input type="radio" name="chem" value="lifepo4" onchange="calc()"> <div class="radio-opt">LiFePO4</div></label>
            <label><input type="radio" name="chem" value="lead" onchange="calc()"> <div class="radio-opt">12V Lead</div></label>
        </div>
    </div>

    <div class="row-inputs">
        <div class="group">
            <label>Послідовно (S):</label>
            <input type="number" id="s" value="4" min="1" oninput="calc()">
        </div>
        <div class="group">
            <label>Паралельно (P):</label>
            <input type="number" id="p" value="1" min="1" oninput="calc()">
        </div>
    </div>

    <div class="group">
        <label>Ємність 1 елемента (mAh):</label>
        <input type="number" id="capacity" value="2500" min="1" step="100" oninput="calc()">
    </div>

    <div class="result-panel">
        <div class="res-row"><span>Конфігурація:</span> <span id="config" class="res-val">4S 1P</span></div>
        <div class="res-row"><span>Напруга збірки:</span> <span id="v" class="res-val">14.4 V</span></div>
        <div class="res-row"><span>Загальна ємність:</span> <span id="totalCap" class="res-val">2.5 Ah</span></div>
        <div class="res-row"><span>Енергія (Вт·год):</span> <span id="totalWh" class="res-val">36 Wh</span></div>
        <div class="res-row"><span>Всього елементів:</span> <span id="total" class="res-val">4 шт.</span></div>
    </div>

    <div class="viz-box" id="viz"></div>

    <footer>
        Dima Lasun | <a href="https://github.com/dimon-qrz" target="_blank">GitHub</a> | <a href="https://www.facebook.com/groups/3145673675685047" target="_blank">Група FB</a>
    </footer>
</div>

<script>
    function calc() {
        const chem = document.querySelector('input[name="chem"]:checked').value;
        const s = parseInt(document.getElementById('s').value) || 1;
        const p = parseInt(document.getElementById('p').value) || 1;
        const capMah = parseFloat(document.getElementById('capacity').value) || 0;
        
        const rates = { liion: 3.6, lifepo4: 3.2, lead: 12.0 };
        const baseV = rates[chem];
        const voltage = (s * baseV).toFixed(1);
        
        const totalCapAh = (capMah * p) / 1000;
        const totalWh = (totalCapAh * voltage).toFixed(1);

        document.getElementById('config').innerText = `${s}S ${p}P`;
        document.getElementById('v').innerText = voltage + " V";
        document.getElementById('totalCap').innerText = totalCapAh >= 1 ? totalCapAh.toFixed(2) + " Ah" : capMah * p + " mAh";
        document.getElementById('totalWh').innerText = totalWh + " Wh";
        document.getElementById('total').innerText = (s * p) + " шт.";
        
        const viz = document.getElementById('viz');
        viz.innerHTML = '';
        
        const maxDisplayS = 8;
        const maxDisplayP = 8;
        const renderS = Math.min(s, maxDisplayS);
        const renderP = Math.min(p, maxDisplayP);

        for (let i = 0; i < renderS; i++) {
            let row = document.createElement('div');
            row.className = 'battery-row';
            for (let j = 0; j < renderP; j++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                row.appendChild(cell);
            }
            viz.appendChild(row);
        }

        if (s > maxDisplayS || p > maxDisplayP) {
            let hint = document.createElement('div');
            hint.style.fontSize = '11px';
            hint.style.color = '#8b949e';
            hint.innerText = `(Показано скорочено для збірки ${s}S × ${p}P)`;
            viz.appendChild(hint);
        }
    }
    calc();
</script>
</body>
</html>
